# Phase 6: Caddy is now the single published entry point (ADR 0014, spec
# 6.4) — the api container is no longer published to the host at all, only
# reachable from Caddy over the compose network by service name.
services:
  api:
    image: ${REGISTRY:-localhost:5000}/cairn-api:${TAG:-latest}
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      DATABASE_PATH: /data/cairn.db
      API_TOKEN: ${API_TOKEN}
      API_TOKEN_READONLY: ${API_TOKEN_READONLY:-}
    volumes:
      - /srv/cairn/data:/data
      # Written by scripts/backup.sh on host cron (ADR 0009/0012) —
      # read-only from the API's side, it never writes here itself.
      - /srv/cairn/backups:/backup-status:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /srv/cairn/Caddyfile:/etc/caddy/Caddyfile:ro
      - /srv/cairn/tls:/etc/caddy/tls:ro
      - /srv/cairn/frontend-dist:/srv/frontend:ro
      - caddy_data:/data
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true

volumes:
  caddy_data:
