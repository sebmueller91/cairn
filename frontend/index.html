<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#05070d" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- "black", not "black-translucent": translucent would pull content up
         under the status bar and every existing page would need safe-area
         padding it does not have yet. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Cairn" />
    <title>Cairn</title>
    <script>
      // Applied before React loads so the light surface never flashes on
      // a dark-themed cold start (spec 8.3). Must stay in lockstep with
      // src/lib/theme.ts: dark is the default, "system" is the only value
      // that leaves data-theme off and lets the media queries decide.
      (function () {
        var stored = localStorage.getItem("cairn-theme");
        if (stored !== "system") {
          var theme = stored === "light" ? "light" : "dark";
          document.documentElement.setAttribute("data-theme", theme);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", theme === "light" ? "#ffffff" : "#05070d");
        }
        // Same reason, higher stakes: privacy mode exists so amounts are not
        // seen, and a cold start that painted them for one frame before React
        // mounted would defeat it in exactly the situation it is for — someone
        // standing next to you. Keep in lockstep with src/lib/privacy.ts.
        if (localStorage.getItem("cairn-privacy") === "on") {
          document.documentElement.setAttribute("data-privacy", "on");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
